name: E2E Playwright Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "app/**"
      - "prisma/**"
      - "e2e/**"
      - ".github/workflows/playwright.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "app/**"
      - "prisma/**"
      - "e2e/**"

# Cancel previous runs on the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Playwright Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    # Common environment variables for all steps
    env:
      # Core
      DATABASE_URL: "postgresql://postgres:${{ github.run_id }}-${{ github.run_attempt }}-moodday-e2e@localhost:5432/nowts_test"
      DATABASE_URL_UNPOOLED: "postgresql://postgres:${{ github.run_id }}-${{ github.run_attempt }}-moodday-e2e@localhost:5432/nowts_test"
      PLAYWRIGHT_DATABASE_URL: "postgresql://postgres:${{ github.run_id }}-${{ github.run_attempt }}-moodday-e2e@localhost:5432/nowts_test"
      # This Postgres service is disposable and scoped to this CI job.
      PLAYWRIGHT_ALLOW_SHARED_DATABASE: "true"
      BETTER_AUTH_SECRET: ""
      BETTER_AUTH_URL: "http://localhost:3000"
      NODE_ENV: "production"
      # Email
      RESEND_API_KEY: ""
      RESEND_AUDIENCE_ID: ""
      EMAIL_FROM: "Moodday <no-reply@example.invalid>"
      NEXT_PUBLIC_EMAIL_CONTACT: "hello@moodday.app"
      # Stripe
      STRIPE_SECRET_KEY: ""
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
      STRIPE_PLUS_MONTHLY_PRICE_ID: ""
      STRIPE_PLUS_YEARLY_PRICE_ID: ""
      BILLING_ENABLED: "false"
      AI_INSIGHTS_ENABLED: "false"
      # OAuth
      GITHUB_CLIENT_ID: ""
      GITHUB_CLIENT_SECRET: ""
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      # Analytics
      NEXT_PUBLIC_POSTHOG_KEY: ""
      NEXT_PUBLIC_POSTHOG_HOST: ""
      # Playwright specific
      PLAYWRIGHT_TEST_BASE_URL: "http://localhost:3000"
      HEADLESS: "true"
      CI: "true"
      PORT: 3000

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: "${{ github.run_id }}-${{ github.run_attempt }}-moodday-e2e"
          POSTGRES_USER: postgres
          POSTGRES_DB: nowts_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "pnpm"

      - name: Generate an ephemeral auth secret
        run: openssl rand -hex 32 | sed 's/^/BETTER_AUTH_SECRET=/' >> "$GITHUB_ENV"

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --prod=false

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Apply database migrations
        run: pnpm prisma migrate deploy

      - name: Build application
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Start application
        run: pnpm start &

      - name: Wait for application to be ready
        run: pnpm dlx wait-on@latest http://localhost:3000 --timeout 60000

      - name: Run Playwright tests
        run: pnpm test:e2e:ci

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: test-results/
          retention-days: 30
