name: E2E Playwright Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Playwright (${{ matrix.project }})
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile-chromium, mobile-webkit]
    env:
      DATABASE_URL: postgresql://postgres:${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}-moodday-e2e@localhost:5432/moodday_e2e
      DATABASE_URL_UNPOOLED: postgresql://postgres:${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}-moodday-e2e@localhost:5432/moodday_e2e
      PLAYWRIGHT_DATABASE_URL: postgresql://postgres:${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}-moodday-e2e@localhost:5432/moodday_e2e
      PLAYWRIGHT_ALLOW_SHARED_DATABASE: "true"
      # The app is started outside Playwright's webServer process in CI, so it
      # must receive the isolated-suite marker explicitly.
      PLAYWRIGHT_DATABASE_GUARD_CONFIGURED: "true"
      BETTER_AUTH_URL: http://localhost:3000
      # Reserved test recipients are short-circuited before any provider call;
      # this value only satisfies fail-closed feature availability checks.
      RESEND_API_KEY: re_playwright_test_only_not_a_provider_credential
      EMAIL_FROM: Moodday <no-reply@example.invalid>
      NEXT_PUBLIC_EMAIL_CONTACT: hello@moodday.app
      BILLING_ENABLED: "false"
      AI_INSIGHTS_ENABLED: "false"
      CAREGIVER_SHARING_ENABLED: "true"
      PUSH_NOTIFICATIONS_ENABLED: "false"
      ACCOUNT_IMPORT_ENABLED: "true"
      LEGAL_TERMS_VERSION: terms-2026-08
      LEGAL_PRIVACY_VERSION: privacy-2026-08
      AI_CONSENT_VERSION: ai-consent-2026-08
      HEALTH_DATA_CONSENT_VERSION: health-data-2026-08
      PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000
      HEADLESS: "true"
      CI: "true"
      PORT: 3000
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}-moodday-e2e
          POSTGRES_USER: postgres
          POSTGRES_DB: moodday_e2e
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: pnpm
      - name: Generate ephemeral auth and operational secrets
        run: |
          openssl rand -hex 32 | sed 's/^/BETTER_AUTH_SECRET=/' >> "$GITHUB_ENV"
          openssl rand -hex 32 | sed 's/^/CRON_SECRET=/' >> "$GITHUB_ENV"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate client and apply migrations
        run: pnpm prisma generate && pnpm prisma migrate deploy
      - name: Build application
        env:
          NODE_ENV: production
        run: pnpm build
      - name: Install browser
        run: pnpm exec playwright install ${{ contains(matrix.project, 'webkit') && 'webkit' || (matrix.project == 'firefox' && 'firefox' || 'chromium') }} --with-deps
      - name: Start application
        run: pnpm start &
      - name: Wait for application
        run: pnpm exec wait-on http://localhost:3000/api/health --timeout 60000
      - name: Run browser suite
        run: pnpm exec playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 30
