name: Code quality and supply chain

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:${{ github.run_id }}-${{ github.run_attempt }}-moodday-ci@localhost:5432/moodday_ci
      DATABASE_URL_UNPOOLED: postgresql://postgres:${{ github.run_id }}-${{ github.run_attempt }}-moodday-ci@localhost:5432/moodday_ci
      BETTER_AUTH_SECRET: ${{ github.run_id }}-${{ github.run_attempt }}-moodday-ci-auth-secret
      BETTER_AUTH_URL: http://localhost:3000
      NODE_ENV: test
      BILLING_ENABLED: "false"
      AI_INSIGHTS_ENABLED: "false"
      CAREGIVER_SHARING_ENABLED: "false"
      PUSH_NOTIFICATIONS_ENABLED: "false"
      ACCOUNT_IMPORT_ENABLED: "false"
      LEGAL_TERMS_VERSION: terms-2026-08
      LEGAL_PRIVACY_VERSION: privacy-2026-08
      AI_CONSENT_VERSION: ai-consent-2026-08
      HEALTH_DATA_CONSENT_VERSION: health-data-2026-08
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-moodday-ci
          POSTGRES_USER: postgres
          POSTGRES_DB: moodday_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Runtime dependency audit
        run: pnpm audit --prod --audit-level=high
      - name: Validate and generate Prisma client
        run: pnpm prisma validate && pnpm prisma generate
      - name: Validate Vercel source boundary
        run: pnpm verify:vercel-source-boundary
      - name: Apply every migration to an empty database
        run: pnpm prisma migrate deploy
      - name: Lint
        run: pnpm lint:ci
      - name: TypeScript
        run: pnpm ts
      - name: Enforce unit tests and release coverage thresholds
        run: pnpm test:coverage:release
      - name: Dead-code analysis
        run: pnpm knip
      - name: Production build
        env:
          NODE_ENV: production
        run: pnpm build
      - name: Generate SBOM
        run: mkdir -p artifacts && pnpm sbom
      - name: Check production dependency licenses
        run: pnpm licenses:check
      - name: Upload coverage and SBOM
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-evidence
          path: |
            coverage/
            artifacts/sbom.cdx.json
          retention-days: 30

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
