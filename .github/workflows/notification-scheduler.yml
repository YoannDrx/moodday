name: Medication notification scheduler

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: moodday-notification-scheduler
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  trigger-notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger the authenticated notification route
        env:
          CRON_SECRET: ${{ secrets.MOODDAY_CRON_SECRET }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl \
            --silent \
            --show-error \
            --location \
            --max-time 240 \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "User-Agent: Moodday-GitHub-Cron/1.0" \
            https://www.moodday.app/api/cron/notifications)"

          cat "$response_file"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Notification scheduler failed with HTTP $status" >&2
            exit 1
          fi
