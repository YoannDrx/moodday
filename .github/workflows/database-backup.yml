name: Encrypted database backup

# Neon's free plan keeps only a few hours of history. This job keeps a daily,
# encrypted logical dump for 30 days. It never writes to the database and stays
# inert until both secrets exist:
# - PRODUCTION_BACKUP_DATABASE_URL: direct (non-pooled) URL of a read-only role
# - BACKUP_AGE_RECIPIENT: age public key; the private key never enters GitHub

on:
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:

concurrency:
  group: database-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRODUCTION_BACKUP_DATABASE_URL: ${{ secrets.PRODUCTION_BACKUP_DATABASE_URL }}
      BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
    steps:
      - name: Check backup configuration
        id: config
        run: |
          if [ -z "$PRODUCTION_BACKUP_DATABASE_URL" ] || [ -z "$BACKUP_AGE_RECIPIENT" ]; then
            echo "::warning::Backup secrets are not configured; no backup was taken."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install age
        if: steps.config.outputs.configured == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age

      - name: Dump, verify and encrypt
        if: steps.config.outputs.configured == 'true'
        run: |
          set -euo pipefail
          umask 077
          stamp="$(date -u +%Y-%m-%dT%H%M%SZ)"
          work="$RUNNER_TEMP/backup"
          mkdir -p "$work" artifacts
          # pg_dump must be at least the server major version (PostgreSQL 17).
          docker run --rm -e PRODUCTION_BACKUP_DATABASE_URL \
            -v "$work:/backup" postgres:17 \
            sh -c 'pg_dump --format=custom --no-owner --no-privileges \
              --file=/backup/moodday.dump "$PRODUCTION_BACKUP_DATABASE_URL"'
          # Read the archive's table of contents only; no row content is printed.
          tables="$(docker run --rm -v "$work:/backup" postgres:17 \
            pg_restore --list /backup/moodday.dump | grep -c ' TABLE DATA ' || true)"
          if [ "$tables" -lt 40 ]; then
            echo "::error::Dump lists only $tables tables; refusing to keep it."
            exit 1
          fi
          age --encrypt --recipient "$BACKUP_AGE_RECIPIENT" \
            --output "artifacts/moodday-$stamp.dump.age" "$work/moodday.dump"
          shred -u "$work/moodday.dump" 2>/dev/null || rm -f "$work/moodday.dump"
          echo "Backup verified: $tables tables, $(stat -c %s "artifacts/moodday-$stamp.dump.age") encrypted bytes"
          echo "BACKUP_STAMP=$stamp" >> "$GITHUB_ENV"

      - name: Keep the encrypted dump for 30 days
        if: steps.config.outputs.configured == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: moodday-backup-${{ env.BACKUP_STAMP }}
          path: artifacts/*.dump.age
          retention-days: 30
          if-no-files-found: error
