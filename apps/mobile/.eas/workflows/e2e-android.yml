name: Mood Day mobile E2E — Android

on:
  workflow_dispatch: {}

jobs:
  build_android_for_e2e:
    name: Build Android emulator app
    type: build
    params:
      platform: android
      profile: e2e-test

  maestro_test:
    name: Run sign-in smoke flow
    needs: [build_android_for_e2e]
    type: maestro
    params:
      build_id: ${{ needs.build_android_for_e2e.outputs.build_id }}
      flow_path: .maestro/sign-in-smoke.yml
