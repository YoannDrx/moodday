# Project Context (from user input)
project_description: |
  Moodday est un journal clinique-friendly (PWA) pour les personnes vivant avec
  des troubles psychiatriques (TDAH, bipolarité, dépression, anxiété).

  Fonctionnalités clés:
  - Suivi quotidien humeur (0-10) + énergie + sommeil
  - Gestion médicamenteuse (régulier + PRN)
  - Collaboration aidant/professionnel avec permissions granulaires
  - Export PDF pour consultations psy
  - IA pour détecter les patterns (sans diagnostic)
  - 18 screens planifiés pour MVP (12 semaines)

